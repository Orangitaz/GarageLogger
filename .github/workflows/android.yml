name: Build Android APK

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read version
        id: ver
        run: echo "v=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create Android project
        working-directory: android
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Set version, icon and colours
        working-directory: android
        run: |
          V="${{ steps.ver.outputs.v }}"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          for d in android/app/src/main/res/mipmap-*; do
            case "$d" in *anydpi*) continue;; esac
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp ../public/icon-192.png "$d/$n.png"
            done
          done
          mkdir -p android/app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#06080C</color></resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp android/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: |
          cp android/android/app/build/outputs/apk/debug/app-debug.apk "garage-log-${{ steps.ver.outputs.v }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: garage-log-apk
          path: garage-log-*.apk
          if-no-files-found: error
