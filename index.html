<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garage Log</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6a737d;--ac:#0b6e4f;--bd:#e1e4e8;--bad:#c62828;--warn:#b26a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1f26;--tx:#e8ebef;--mu:#98a2ad;--ac:#3ecf9a;--bd:#2a313a;--bad:#ef6b6b;--warn:#f0b04a}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1f26;--tx:#e8ebef;--mu:#98a2ad;--ac:#3ecf9a;--bd:#2a313a;--bad:#ef6b6b;--warn:#f0b04a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding-bottom:150px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:10px 12px 0;border-bottom:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center}.t{flex:1;font-size:20px}
select,input,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#0b1a14}}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px}
.tabs button{border:0;background:none;border-bottom:3px solid transparent;border-radius:0;white-space:nowrap;color:var(--mu);padding:8px 10px}
.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{padding:12px;max-width:640px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.c h3{margin:0 0 2px;font-size:16px}.m{color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);margin-left:6px}
.bad{color:var(--bad);border-color:var(--bad)}.warn{color:var(--warn);border-color:var(--warn)}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 3px 10px #0004}
.fabl{right:auto;left:16px}
#bn{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#bn button{flex:1;border:0;border-radius:0;background:none;color:var(--mu);padding:14px}#bn button.on{color:var(--ac);font-weight:700}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--tx);width:min(94vw,440px);max-height:90vh;padding:16px}
dialog::backdrop{background:#0007}
label{display:block;font-size:13px;color:var(--mu);margin-top:10px}
dialog input,dialog textarea,dialog select{width:100%}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.x{float:right;border:0;background:none;color:var(--mu);padding:0 4px}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ph img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.sp{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--bd)}.sp:last-child{border:0}
.q{display:flex;gap:8px;align-items:center;margin-top:8px}.q button{width:40px}
</style>
</head>
<body>
<header><div class="row" id="hd"></div><div class="tabs" id="tabs"></div></header>
<main id="list"></main>
<button class="fab p" id="fab">+</button>
<button class="fab fabl p" id="fabE" title="Edit parts list" style="display:none">✎</button>
<div id="bn"><button data-v="garage">🚗 Garage</button><button data-v="inventory">🧴 Inventory</button></div>
<dialog id="dlg"><div id="dbody"></div></dialog>
<script>
const TYPES=[["service","Service"],["repair","Repairs"],["upgrade","Upgrades"],["parts","Parts"],["reminder","Reminders"],["odometer","Odometer"],["note","Notes"]];
const SPECS=[["oilW","Oil weight","5W-30"],["oilC","Oil capacity","4.5 qt"],["oilF","Oil filter #",""],["airF","Air filter #",""],["blade","Blade / belt #",""],["fuelF","Fuel filter #",""],["plug","Spark plugs",""],["tire","Tire size",""]];
const CATS=["Oil","Lube","Grease","Filter","Part","Other"],PH=["service","repair","upgrade"];
let S={vehicles:[],records:[],inv:[],cur:null,units:"imperial"},view="garage",tab="service",ic="All",gk="All",em=false,lk="";
try{const r=localStorage.getItem("garagelog");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.records=S.records.filter(r=>r.type!=="fuel");
const save=()=>{try{localStorage.setItem("garagelog",JSON.stringify(S))}catch(e){}push()};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10);
const addM=(s,n)=>{const d=new Date(s+"T00:00:00"),day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()!==day)d.setDate(0);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const KINDS=[["car","Car / Truck","🚗"],["offroad","Off-road","🏞️","Off-road (UTV / ATV / dirt bike)"],["trailer","Trailer","🚚"],["mower","Lawn mower","🌿"],["other","Other","🔧"]];
const vOf=id=>S.vehicles.find(v=>v.id===id);
const isH=id=>(vOf(id)||{}).meter==="hrs",isT=id=>(vOf(id)||{}).meter==="time";
const dU=(id=S.cur)=>isH(id)?"hrs":S.units==="imperial"?"mi":"km";
const soonAt=id=>isH(id)?10:500;
const kIc=k=>(KINDS.find(x=>x[0]===k)||KINDS[KINDS.length-1])[2];
const veh=()=>S.vehicles.find(v=>v.id===S.cur);
const lastOdo=id=>Math.max(0,...S.records.filter(r=>r.vid===id&&r.odo!==""&&r.odo!=null).map(r=>+r.odo||0));
function rinfo(r,lo){
  if(r.done)return{st:-1,txt:"Done"};let st=0,p=[];
  if(r.date){const d=Math.round((new Date(r.date)-new Date(today()))/864e5);st=d<0?2:d<=30?1:0;p.push(d<0?`${-d}d overdue`:d===0?"due today":`in ${d}d`)}
  if(r.odo!==""&&r.odo!=null){const d=r.odo-lo;st=Math.max(st,d<=0?2:d<=soonAt(r.vid)?1:0);p.push(d<=0?`${-d} ${dU(r.vid)} over`:`in ${d} ${dU(r.vid)}`)}
  return{st,txt:p.join(" / ")};
}
function vstat(v){
  const lo=lastOdo(v.id),a=S.records.filter(r=>r.vid===v.id&&r.type==="reminder"&&!r.done).map(r=>({r,i:rinfo(r,lo)})).concat(v.kind==="offroad"&&v.ohv?[{r:{desc:"OHV sticker",date:v.ohv},i:rinfo({date:v.ohv,odo:"",vid:v.id},lo)}]:[]).sort((x,y)=>y.i.st-x.i.st||(x.r.date||"9").localeCompare(y.r.date||"9"));
  if(!a.length)return{st:0,txt:"No reminders set"};
  return{st:a[0].i.st,txt:`${a[0].r.desc||"Reminder"} · ${a[0].i.txt}`};
}
const tag=st=>st==2?'<span class="tag bad">Overdue</span>':st==1?'<span class="tag warn">Due soon</span>':'<span class="tag">OK</span>';

function render(){
  const v0=veh();if(view==="vehicle"&&v0&&isT(v0.id)&&tab==="odometer")tab="service";
  const key=view+tab+S.cur;if(key!==lk){em=false;lk=key}
  const v=veh(),inV=view==="vehicle"&&v;
  $("hd").innerHTML=inV?`<button id="back">←</button><b class="t">${esc(v.name)}</b><button id="ev">✎</button><button id="more">⋯</button>`:`<b class="t">${view==="inventory"?"Inventory":"My Garage"}</b><button id="more">⋯</button>`;
  const pk=KINDS.filter(k=>S.vehicles.some(x=>x.kind===k[0]));if(gk!=="All"&&!pk.some(k=>k[0]===gk))gk="All";
  const tl=inV?TYPES.filter(t=>!(isT(v.id)&&t[0]==="odometer")).map(([k,l])=>[k,k==="odometer"&&isH(v.id)?"Hours":l]):view==="inventory"?["All",...CATS].map(x=>[x,x]):pk.length>1?[["All","All"],...pk.map(k=>[k[0],k[1]])]:[];
  $("tabs").innerHTML=tl.map(([k,l])=>`<button class="${k===(inV?tab:view==="inventory"?ic:gk)?"on":""}" data-t="${k}">${l}</button>`).join("");
  $("bn").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===(view==="inventory"?"inventory":"garage")));
  $("fab").style.display="";$("fabE").style.display=inV?"":"none";$("fabE").textContent=em&&tab!=="parts"?"✓":"✎";
  const L=$("list");
  if(inV)L.innerHTML=(v.cover?`<img src="${v.cover}" style="width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px">`:"")+(tab==="parts"?partsView(v):recView(v));
  else if(view==="inventory")L.innerHTML=invView();
  else L.innerHTML=garageView();
}
function garageView(){
  if(!S.vehicles.length)return'<div class="empty">Your garage is empty. Tap + to add a vehicle, ATV, dirt bike, mower or other equipment.</div>';
  return S.vehicles.filter(v=>gk==="All"||v.kind===gk).map(v=>{const s=vstat(v),line=(v.plist||[]).filter(x=>x.v).slice(0,3).map(x=>x.l+" "+x.v).join(" · ");
    return `<div class="c" data-open="${v.id}">${v.cover?`<img src="${v.cover}" data-open="${v.id}" style="width:100%;height:130px;object-fit:cover;border-radius:8px;margin-bottom:8px">`:""}<h3 data-open="${v.id}">${kIc(v.kind)} ${esc(v.name)}${tag(s.st)}</h3><div class="m" data-open="${v.id}">${esc(v.model||"")}${isT(v.id)?"":(v.model?" · ":"")+lastOdo(v.id).toLocaleString()+" "+dU(v.id)}</div><div class="m" data-open="${v.id}" style="margin-top:6px;color:var(--tx)">Next: ${esc(s.txt)}</div>${line?`<div class="m" data-open="${v.id}">${esc(line)}</div>`:""}</div>`}).join("");
}
function recView(v){
  const lo=lastOdo(v.id),n=S.records.filter(r=>r.vid===v.id&&["service","repair","upgrade"].includes(r.type)).length;
  let out=`<div class="m" style="margin-bottom:10px">${isT(v.id)?"":lo.toLocaleString()+" "+dU(v.id)+" · "}${n} service/repair records</div>`;
  const rows=S.records.filter(r=>r.vid===v.id&&r.type===tab).sort((a,b)=>tab==="reminder"?(a.date||"9").localeCompare(b.date||"9"):(b.date||"").localeCompare(a.date||"")||b.odo-a.odo);
  if(!rows.length)out+='<div class="empty">Nothing here yet. Tap + to add.</div>';
  return out+(em?'<div class="m" style="margin-bottom:8px;color:var(--ac)">Edit mode: use Edit or Delete on an entry, then tap ✓ when done.</div>':"")+rows.map(card).join("");
}
function card(r){
  const odo=r.odo!==""&&r.odo!=null?`${(+r.odo).toLocaleString()} ${dU(r.vid)}`:"";
  let title=esc(r.desc||TYPES.find(t=>t[0]===r.type)[1]),meta=[r.date,odo].filter(Boolean).join(" · "),extra="";
  if(r.type==="odometer")title=isH(r.vid)?"Hours reading":"Odometer reading";
  if(r.type==="reminder"){const i=rinfo(r,lastOdo(r.vid));extra=r.done?'<span class="tag">Done</span>':tag(i.st);meta=["Due",r.date,odo].filter(Boolean).join(" · ")+(r.done?"":` (${i.txt})`)}
  const rc=(r.rc||[]).map((p,i)=>`<img src="${p}" data-ph="${r.id}:${i}:rc">`).join(""),ph=(r.ph||[]).map((p,i)=>`<img src="${p}" data-ph="${r.id}:${i}">`).join("");
  return `<div class="c"><h3>${title}${extra}</h3><div class="m">${meta}</div>${(r.dl||[]).length?`<div class="m" style="margin-top:6px">${r.dl.map(x=>"• "+esc(x)).join("<br>")}</div>`:""}${(r.parts?[r.parts]:[]).concat(r.pl||[]).length?`<div class="m" style="margin-top:6px">Parts: ${(r.parts?[r.parts]:[]).concat(r.pl||[]).map(esc).join(" · ")}</div>`:""}${r.notes?`<div class="m" style="margin-top:6px;color:var(--tx)">${esc(r.notes)}</div>`:""}${ph?`<div class="ph">${ph}</div>`:""}${rc?`<div class="m" style="margin-top:8px">Receipts</div><div class="ph">${rc}</div>`:""}${r.type==="reminder"&&!r.done?`<button style="margin-top:8px" data-done="${r.id}">Mark done</button>`:""}${em?`<div class="row" style="margin-top:10px"><button class="p" data-edit="${r.id}" style="flex:1">Edit</button><button data-del="${r.id}" style="flex:1">Delete</button></div>`:""}</div>`;
}
function partsView(v){
  const top=[["License plate",["car","trailer"].includes(v.kind)?v.plate:""],["OHV sticker expires",v.kind==="offroad"?v.ohv:""],["VIN / serial #",v.vin]].filter(x=>x[1]).map(([l,x])=>`<div class="sp"><span class="m">${l}</span><span>${esc(x)}</span></div>`).join("");
  return `<div class="c">${top}${(v.plist||[]).map(r=>`<div class="sp"><span class="m">${esc(r.l)}</span><span style="white-space:pre-wrap;text-align:right">${esc(r.v||"—")}</span></div>`).join("")||'<div class="m">No parts yet. Tap + to add one as you go.</div>'}</div>`;
}
function invView(){
  let a=S.inv.filter(i=>ic==="All"||i.cat===ic).sort((x,y)=>x.cat.localeCompare(y.cat)||x.name.localeCompare(y.name));
  if(!a.length)return'<div class="empty">No items. Tap + to add oil, grease, filters or parts on hand.</div>';
  return a.map(i=>`<div class="c"><button class="x" data-idel="${i.id}">✕</button><h3 data-iedit="${i.id}">${esc(i.name)}<span class="tag">${i.cat}</span></h3>${i.notes?`<div class="m">${esc(i.notes)}</div>`:""}<div class="q"><button data-q="${i.id}:-1">−</button><b>${i.qty}</b> <span class="m">${esc(i.unit||"")}</span><button data-q="${i.id}:1">+</button></div></div>`).join("");
}
function shrink(f,mx=800,q=.65){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};i.src=r.result};r.readAsDataURL(f)})}
const btns='<div class="row" style="margin-top:14px"><button id="cancel" style="flex:1">Cancel</button><button class="p" id="ok" style="flex:1">Save</button></div>';
function show(h){$("dbody").onclick=null;$("dbody").innerHTML=h;$("dlg").showModal();if($("cancel"))$("cancel").onclick=()=>$("dlg").close()}
function openForm(id){
  const e=id?S.records.find(r=>r.id===id):{type:tab,date:today(),odo:"",desc:"",notes:"",parts:"",ph:[]};
  const t=e.type,rem=t==="reminder",hp=PH.includes(t),sr=["service","repair","upgrade"].includes(t);const nopts=isT(S.cur)?[[1,"1 month"],[3,"3 months"],[6,"6 months"],[12,"1 year"]]:(isH(S.cur)?[10,25,50,100,150,200,250]:[1000,3000,5000,7500,10000,15000]).map(n=>[n,n.toLocaleString()+" "+dU()]);
  const cs=+e.next>0&&!nopts.some(([n])=>n===+e.next);
  let ph=(e.ph||[]).slice(),rc=(e.rc||[]).slice();
  show(`<h3 style="margin:0">${id?"Edit":"Add"} ${t==="odometer"&&isH(S.cur)?"hours":TYPES.find(x=>x[0]===t)[1].toLowerCase()}</h3>
  <label>${rem?"Due date (optional)":"Date"}</label><input type="date" id="f_date" value="${e.date||""}">${t==="service"?`<label>Next service due after</label><select id="f_next"><option value="0">Not scheduled</option>${nopts.map(([n,l])=>`<option value="${n}" ${+e.next===n?"selected":""}>${l}</option>`).join("")}<option value="c" ${cs?"selected":""}>Custom…</option></select><input type="number" inputmode="numeric" id="f_nextc" value="${cs?e.next:""}" placeholder="${isT(S.cur)?"Months":dU()}" style="margin-top:6px;display:${cs?"":"none"}">`:""}
  ${isT(S.cur)?"":`<label>${rem?"Due at "+dU()+" (optional)":(isH(S.cur)?"Hours":"Odometer ("+(S.units==="imperial"?"mi":"km")+")")}</label><input type="number" inputmode="numeric" id="f_odo" value="${e.odo}" placeholder="${lastOdo(S.cur)||""}">`}
  ${sr?'<label style="display:flex;align-items:center;gap:8px">Description <button class="p" id="adddc" style="width:28px;height:28px;padding:0;border-radius:50%;font-size:20px;line-height:1">+</button></label><div id="dls"></div>':""}${t!=="odometer"&&!sr?`<label>${t==="note"?"Title":"Description"}</label><input id="f_desc" value="${esc(e.desc)}" placeholder="${rem?"e.g. Oil change":t==="service"?"e.g. Oil & filter":""}">`:""}
  ${sr?'<label style="display:flex;align-items:center;gap:8px">Parts used <button class="p" id="addpt" style="width:28px;height:28px;padding:0;border-radius:50%;font-size:20px;line-height:1">+</button></label><div id="pls"></div>':""}
    <label>Notes</label><textarea id="f_notes" rows="3">${esc(e.notes)}</textarea>
  ${hp?'<label>Photos</label><div class="ph" id="ph"></div><input type="file" id="pf" accept="image/*" multiple>':""}${sr?'<label>Receipts</label><div class="ph" id="rc"></div><input type="file" id="rf" accept="image/*" multiple>':""}${btns}`);
  const grp=(box,inp,arr,mx,q)=>{const d=()=>{if(!$(box))return;$(box).innerHTML=arr.map((p,i)=>`<img src="${p}" data-rm="${i}">`).join("")+(arr.length?'<div class="m" style="width:100%">Tap an image to remove it</div>':"")};d();if($(inp)){$(inp).onchange=async()=>{for(const f of $(inp).files)arr.push(await shrink(f,mx,q));$(inp).value="";d()};$(box).onclick=ev=>{const i=ev.target.dataset.rm;if(i!=null){arr.splice(+i,1);d()}}}};
  grp("ph","pf",ph,800,.65);grp("rc","rf",rc,1600,.7);
  let pl=sr?[...(e.parts?[e.parts]:[]),...(e.pl||[])]:[];if(sr&&!pl.length)pl=[""];
  const dpl=()=>{if($("pls"))$("pls").innerHTML=pl.map((x,i)=>`<div class="row" style="margin-top:6px"><input class="pt" value="${esc(x)}" placeholder="Part"><button data-pd="${i}">✕</button></div>`).join("")};
  const syncP=()=>{if($("pls"))pl=[...$("pls").querySelectorAll(".pt")].map(i=>i.value)};dpl();
  const listUI=(box,btn,arr,ph)=>{
    const d=()=>{$(box).innerHTML=arr.map((x,i)=>`<div class="row" style="margin-top:6px"><input class="${box}i" value="${esc(x)}" placeholder="${ph}"><button data-ld="${i}">✕</button></div>`).join("")};
    const sy=()=>{arr.splice(0,arr.length,...[...$(box).querySelectorAll("."+box+"i")].map(i=>i.value))};
    d();$(btn).onclick=()=>{sy();arr.push("");d();const a=$(box).querySelectorAll("."+box+"i");a[a.length-1].focus()};
    $(box).onclick=ev=>{const i=ev.target.dataset.ld;if(i!=null){sy();arr.splice(+i,1);if(!arr.length)arr.push("");d()}};
    return sy};
  const dl=sr?[e.desc||"",...(e.dl||[])]:[];if(sr&&!dl.length)dl.push("");
  const syD=sr?listUI("dls","adddc",dl,"Description"):()=>{};
  if($("f_next"))$("f_next").onchange=()=>{$("f_nextc").style.display=$("f_next").value==="c"?"":"none"};
  if($("addpt")){$("addpt").onclick=()=>{syncP();pl.push("");dpl();const a=$("pls").querySelectorAll(".pt");a[a.length-1].focus()};$("pls").onclick=ev=>{const i=ev.target.dataset.pd;if(i!=null){syncP();pl.splice(+i,1);if(!pl.length)pl=[""];dpl()}}}
  $("ok").onclick=()=>{
    const g=i=>$(i)?$(i).value:"";
    const o={id:e.id||uid(),vid:S.cur,type:t,date:g("f_date"),odo:$("f_odo")?(g("f_odo")===""?"":+g("f_odo")):(e.odo??""),desc:sr?(syD(),dl.map(x=>x.trim()).filter(Boolean)[0]||""):g("f_desc").trim(),dl:sr?dl.map(x=>x.trim()).filter(Boolean).slice(1):[],parts:"",pl:(syncP(),pl.map(x=>x.trim()).filter(Boolean)),notes:g("f_notes").trim(),ph,rc,done:e.done||false,nrid:e.nrid||"",next:e.next||0};
    if(t==="odometer"&&o.odo==="")return alert(isH(S.cur)?"Enter an hours reading.":"Enter an odometer reading.");
    if(rem&&!o.date&&o.odo==="")return alert("Set a due date or due odometer.");
    if($("f_next")){const sv=$("f_next").value,n=sv==="c"?+($("f_nextc").value||0):+sv;o.next=n;
      const old=e.nrid?S.records.find(r=>r.id===e.nrid):null;
      if(n>0){const tm=isT(S.cur);
        if(tm&&!o.date)return alert("Set a service date to schedule the next service.");
        if(!tm&&o.odo==="")return alert("Enter the "+(isH(S.cur)?"hours":"odometer")+" reading to schedule the next service.");
        const dsc=o.desc?"Next: "+o.desc:"Next service",f=tm?{date:addM(o.date,n),odo:""}:{date:"",odo:o.odo+n};
        if(old&&!old.done){Object.assign(old,f,{desc:dsc});o.nrid=old.id}
        else{const nr=Object.assign({id:uid(),vid:S.cur,type:"reminder",desc:dsc,parts:"",pl:[],dl:[],notes:"",ph:[],rc:[],done:false},f);S.records.push(nr);o.nrid=nr.id}}
      else{if(old&&!old.done)S.records=S.records.filter(r=>r!==old);o.nrid=""}}
    if(id)S.records[S.records.findIndex(r=>r.id===id)]=o;else S.records.push(o);
    save();$("dlg").close();render();
  };
}
function specForm(){
  const v=veh();let rows=v.plist.map(x=>({...x}));
  const sync=()=>{rows=[...$("dbody").querySelectorAll(".pr")].map(d=>({l:d.querySelector(".pl").value.trim(),v:d.querySelector(".pv").value.trim()}))};
  const draw=()=>{
    $("dbody").innerHTML=`<h3 style="margin:0">Parts list</h3><div class="m">Rename, add, reorder or remove your own categories.</div>${rows.map((r,i)=>`<div class="pr" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)"><div class="row"><input class="pl" value="${esc(r.l)}" placeholder="Category"><button data-pup="${i}">↑</button><button data-prm="${i}">✕</button></div><input class="pv" value="${esc(r.v)}" placeholder="Value" style="margin-top:6px"></div>`).join("")}<button id="addp" style="margin-top:12px;width:100%">+ Add category</button>${btns}`;
    $("cancel").onclick=()=>$("dlg").close();
    $("addp").onclick=()=>{sync();rows.push({l:"",v:""});draw();const a=$("dbody").querySelectorAll(".pl");a[a.length-1].focus()};
    $("ok").onclick=()=>{sync();v.plist=rows.filter(r=>r.l);save();$("dlg").close();render()};
  };
  $("dbody").onclick=e=>{const d=e.target.dataset;if(d.prm!=null){sync();rows.splice(+d.prm,1);draw()}else if(d.pup!=null&&+d.pup>0){sync();const i=+d.pup;[rows[i-1],rows[i]]=[rows[i],rows[i-1]];draw()}};
  draw();$("dlg").showModal();
}
function addPart(){
  const v=veh(),labs=[...new Set(S.vehicles.flatMap(x=>(x.plist||[]).filter(r=>r.v).map(r=>r.l)))];
  show(`<h3 style="margin:0">Add part</h3><label>Category</label><input id="ap_l" list="ap_s" placeholder="Category" autocomplete="off"><datalist id="ap_s">${labs.map(l=>`<option value="${esc(l)}">`).join("")}</datalist><label>Value</label><input id="ap_v" placeholder="Value">${btns}`);
  $("ok").onclick=()=>{const l=$("ap_l").value.trim(),x=$("ap_v").value.trim();if(!l)return;const r=v.plist.find(r=>r.l.toLowerCase()===l.toLowerCase());if(r)r.v=x;else v.plist.push({l,v:x});save();$("dlg").close();render()};
}
function vehForm(edit){
  const v=edit?veh():{name:"",model:"",plate:"",kind:"car",meter:"dist"};
  show(`<h3 style="margin:0">${edit?"Edit":"Add"} equipment</h3><label>Cover photo</label><div class="ph" id="cv"></div><input type="file" id="cf" accept="image/*"><label>Type</label><select id="v_k">${KINDS.map(k=>`<option value="${k[0]}" ${k[0]===v.kind?"selected":""}>${k[2]} ${k[3]||k[1]}</option>`).join("")}</select><label>Tracked by</label><select id="v_t"><option value="dist" ${v.meter!=="hrs"&&v.meter!=="time"?"selected":""}>Distance (odometer)</option><option value="hrs" ${v.meter==="hrs"?"selected":""}>Engine hours</option><option value="time" ${v.meter==="time"?"selected":""}>Time (dates only)</option></select><label>Nickname</label><input id="v_n" value="${esc(v.name)}" placeholder="e.g. Daily Driver"><label>Year / Make / Model</label><input id="v_m" value="${esc(v.model)}" placeholder="2015 Polaris RZR XP 1000"><div id="v_pr"><label>License plate (optional)</label><input id="v_p" value="${esc(v.plate)}"></div><div id="v_or"><label>OHV sticker expiration</label><input type="date" id="v_oh" value="${v.ohv||""}"></div><label>VIN / serial # (optional)</label><input id="v_vin" value="${esc(v.vin||"")}">${edit?'<button id="dv" style="margin-top:12px;width:100%">Delete this equipment</button>':""}${btns}`);
  let cover=v.cover||"";const dc=()=>{$("cv").innerHTML=cover?`<img src="${cover}" data-rm="1" style="width:100%;height:140px"><div class="m" style="width:100%">Tap the photo to remove it</div>`:""};dc();
  $("cf").onchange=async()=>{const f=$("cf").files[0];if(f){cover=await shrink(f,700,.7);$("cf").value="";dc()}};$("cv").onclick=e=>{if(e.target.dataset.rm){cover="";dc()}};
  const tp=()=>{const k=$("v_k").value;$("v_pr").style.display=["car","trailer"].includes(k)?"":"none";$("v_or").style.display=k==="offroad"?"":"none"};tp();
  $("v_k").onchange=()=>{tp();if(!edit)$("v_t").value={mower:"hrs",trailer:"time"}[$("v_k").value]||"dist"};
  $("ok").onclick=()=>{const n=$("v_n").value.trim()||$("v_m").value.trim();if(!n)return;
    const f={name:n,model:$("v_m").value.trim(),plate:$("v_p").value.trim(),vin:$("v_vin").value.trim(),ohv:$("v_oh").value,kind:$("v_k").value,meter:$("v_t").value,cover};
    if(edit)Object.assign(v,f);else{const nv=Object.assign({id:uid(),specs:{}},f);fixV(nv);S.vehicles.push(nv)}
    save();$("dlg").close();render()};
  if(edit)$("dv").onclick=()=>{if(!confirm("Delete "+v.name+" and all its records?"))return;S.records=S.records.filter(r=>r.vid!==v.id);S.vehicles=S.vehicles.filter(x=>x.id!==v.id);S.cur=null;view="garage";save();$("dlg").close();render()};
}
function invForm(id){
  const e=id?S.inv.find(i=>i.id===id):{name:"",cat:ic==="All"?"Oil":ic,qty:1,unit:"",notes:""};
  show(`<h3 style="margin:0">${id?"Edit":"Add"} item</h3><label>Name</label><input id="i_n" value="${esc(e.name)}" placeholder="e.g. Mobil 1 5W-30"><label>Category</label><select id="i_c">${CATS.map(c=>`<option ${c===e.cat?"selected":""}>${c}</option>`).join("")}</select><label>Quantity on hand</label><input type="number" step="any" id="i_q" value="${e.qty}"><label>Unit</label><input id="i_u" value="${esc(e.unit)}" placeholder="qt, tube, each"><label>Notes / part number</label><textarea id="i_notes" rows="2">${esc(e.notes)}</textarea>${btns}`);
  $("ok").onclick=()=>{const n=$("i_n").value.trim();if(!n)return;const o={id:e.id||uid(),name:n,cat:$("i_c").value,qty:+$("i_q").value||0,unit:$("i_u").value.trim(),notes:$("i_notes").value.trim()};
    if(id)S.inv[S.inv.findIndex(i=>i.id===id)]=o;else S.inv.push(o);save();$("dlg").close();render()};
}
function dataForm(){
  show(`<h3 style="margin:0">Settings &amp; data</h3><label>Distance units</label><select id="u"><option value="imperial" ${S.units==="imperial"?"selected":""}>Miles</option><option value="metric" ${S.units==="metric"?"selected":""}>Kilometers</option></select>
  <div class="m" style="margin-top:10px">Server sync: <span id="ss">${syncMsg}</span></div>${window.GarageNative?`<label>Server address (TrueNAS)</label><input id="srv" placeholder="http://192.168.1.50:30500" value="${esc(GarageNative.getServer())}"><button id="srvb" style="margin-top:6px;width:100%">Save &amp; sync</button>`:""}<label>Backup (copy this) or paste a backup to restore. Photos make it long.</label><textarea id="bk" rows="5">${esc(JSON.stringify(S))}</textarea>
  <div class="row" style="margin-top:10px"><button id="imp" style="flex:1">Restore from text</button><button class="p" id="ok" style="flex:1">Done</button></div>`);
  $("u").onchange=()=>{S.units=$("u").value;save();render()};
  if($("srvb"))$("srvb").onclick=()=>{GarageNative.setServer($("srv").value.trim());$("ss").textContent="checking...";pull(true).then(()=>{if($("ss"))$("ss").textContent=syncMsg})};$("ok").onclick=()=>$("dlg").close();
  $("imp").onclick=()=>{try{const d=JSON.parse($("bk").value);if(!Array.isArray(d.vehicles)||!Array.isArray(d.records))throw 0;if(!confirm("Replace all current data?"))return;S=Object.assign({inv:[],units:"imperial"},d);S.vehicles.forEach(fixV);save();$("dlg").close();render()}catch(e){alert("That doesn't look like a valid backup.")}};
}
$("hd").onclick=e=>{const i=e.target.id;if(i==="back"){view="garage";render()}else if(i==="more")dataForm();else if(i==="ev")vehForm(true)};
$("tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;if(view==="vehicle")tab=t;else if(view==="inventory")ic=t;else gk=t;render()};
$("bn").onclick=e=>{const v=e.target.dataset.v;if(v){view=v;render()}};
$("fab").onclick=()=>view==="vehicle"?(tab==="parts"?addPart():openForm()):view==="inventory"?invForm():vehForm(false);
$("fabE").onclick=()=>{if(tab==="parts")specForm();else{em=!em;render()}};
$("list").onclick=e=>{const d=e.target.dataset;
  if(d.open){S.cur=d.open;view="vehicle";tab="service";save();render()}
  else if(d.del){if(confirm("Delete this entry?")){S.records=S.records.filter(r=>r.id!==d.del);save();render()}}
  else if(d.edit)openForm(d.edit);
  else if(d.done){S.records.find(x=>x.id===d.done).done=true;save();render()}
  else if(d.specs)specForm();
  else if(d.ph){const[id,i,g]=d.ph.split(":");show(`<img src="${S.records.find(r=>r.id===id)[g||"ph"][+i]}" style="width:100%;border-radius:8px"><div class="row" style="margin-top:10px"><button id="cancel" style="flex:1">Close</button></div>`)}
  else if(d.idel){if(confirm("Remove this item?")){S.inv=S.inv.filter(i=>i.id!==d.idel);save();render()}}
  else if(d.iedit)invForm(d.iedit);
  else if(d.q){const[id,n]=d.q.split(":"),it=S.inv.find(i=>i.id===id);it.qty=Math.max(0,+(it.qty+ +n).toFixed(2));save();render()}};
const fixV=v=>{v.specs=v.specs||{};if(!v.plist){const sp=v.specs;v.plist=SPECS.filter(([k])=>sp[k]).map(([k,l])=>({l,v:sp[k]}));if(sp.other)v.plist.push({l:"Other",v:sp.other})}if(!v.pclean){v.plist=v.plist.filter(r=>r.v||!SPECS.some(x=>x[1]===r.l));v.pclean=1}v.kind=v.kind==="atv"||v.kind==="bike"?"offroad":v.kind||"car";v.meter=v.meter||"dist"};S.vehicles.forEach(fixV);
render();
let syncMsg="not connected yet",pt=null;
const api=()=>{const n=window.GarageNative;if(!n)return"api/state";const u=(n.getServer()||"").trim().replace(/\/+$/,"");return u?u+"/api/state":""};
const push=()=>{clearTimeout(pt);pt=setTimeout(()=>{pt=null;const u=api();if(!u){syncMsg="no server address set";return}fetch(u,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)}).then(r=>{if(!r.ok)throw 0;syncMsg="saved to server"}).catch(()=>{syncMsg="offline (saved on this device only)"})},400)};
const adopt=d=>{S=Object.assign({inv:[],units:"imperial"},d);S.records=S.records.filter(r=>r.type!=="fuel");S.vehicles.forEach(fixV);try{localStorage.setItem("garagelog",JSON.stringify(S))}catch(e){}};
const pull=f=>{if(!f&&(pt||$("dlg").open))return Promise.resolve();const u=api();if(!u){syncMsg="no server address set";return Promise.resolve()}return fetch(u,{cache:"no-store"}).then(r=>r.json()).then(d=>{syncMsg="saved to server";if(d&&Array.isArray(d.vehicles)&&(d.vehicles.length||(d.records||[]).length||(d.inv||[]).length)){if(JSON.stringify(d)!==JSON.stringify(S)){adopt(d);if(view==="vehicle"&&!veh())view="garage";render()}}else if(S.vehicles.length)push()}).catch(()=>{syncMsg="offline (saved on this device only)"})};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
pull();
if(window.GarageNative&&!GarageNative.getServer()&&!S.vehicles.length)setTimeout(dataForm,300);
</script>
</body>
</html>
