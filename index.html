<style>

<body>

<main id="list"></main>
<button class="fab p" id="fab">+</button>
<button class="fab fabl p" id="fabE" title="Edit parts list" style="display:none">✎</button>
<div id="bn"><button data-v="garage"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5V20H3z"/><path d="M7 20v-6h10v6M7 17h10"/></svg>Garage</button><button data-v="inventory"><svg viewBox="0 0 24 24"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>Inventory</button></div>
<dialog id="dlg"><div id="dbody"></div></dialog>
<div id="pv" hidden></div>
<script>
const TYPES=[["dash","Dashboard"],["service","Service"],["repair","Repairs"],["upgrade","Upgrades"],["parts","Parts"],["reminder","Reminders"],["odometer","Odometer"],["note","Notes"]];
const SPECS=[["oilW","Oil weight","5W-30"],["oilC","Oil capacity","4.5 qt"],["oilF","Oil filter #",""],["airF","Air filter #",""],["blade","Blade / belt #",""],["fuelF","Fuel filter #",""],["plug","Spark plugs",""],["tire","Tire size",""]];
const CATS=["Oil","Lube","Grease","Filter","Part","Other"],PH=["service","repair","upgrade"];
let S={vehicles:[],records:[],inv:[],cur:null,units:"imperial"},view="garage",tab="dash",ic="All",gk="All",em=false,lk="";
try{const r=localStorage.getItem("garagelog");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.records=S.records.filter(r=>r.type!=="fuel");
const save=()=>{try{localStorage.setItem("garagelog",JSON.stringify(S))}catch(e){}push()};
const $=id=>document.getElementById(id);
let ours=false;
const theme=()=>{try{return localStorage.getItem("garagelog-theme")||"auto"}catch(e){return"auto"}};
const applyTheme=()=>{const t=theme(),r=document.documentElement;if(t==="auto"){if(ours){r.removeAttribute("data-theme");ours=false}}else{r.setAttribute("data-theme",t);ours=true}
  const dk=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches),m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dk?"#06080c":"#eef1f7"};
const setTheme=t=>{try{localStorage.setItem("garagelog-theme",t)}catch(e){}applyTheme()};
applyTheme();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addM=(s,n)=>{const d=new Date(s+"T00:00:00"),day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()!==day)d.setDate(0);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const KINDS=[["car","Car / Truck","🚗"],["offroad","Off-road","🏞️","Off-road (UTV / ATV / dirt bike)"],["trailer","Trailer","🚚"],["mower","Lawn mower","🌿"],["other","Other","🔧"]];
const KC={car:"#4da3ff",offroad:"#ff7a3d",trailer:"#b07cff",mower:"#2bf0a0",other:"#9aa7b8"},SC=["var(--ac)","var(--warn)","var(--bad)"];
const vOf=id=>S.vehicles.find(v=>v.id===id);
const isH=id=>(vOf(id)||{}).meter==="hrs",isT=id=>(vOf(id)||{}).meter==="time";
const dU=(id=S.cur)=>isH(id)?"hrs":S.units==="imperial"?"mi":"km";
const soonAt=id=>+(vOf(id)||{}).soonDist||(isH(id)?10:500),soonD=id=>+(vOf(id)||{}).soonDays||30;
const kIc=k=>(KINDS.find(x=>x[0]===k)||KINDS[KINDS.length-1])[2];
const veh=()=>S.vehicles.find(v=>v.id===S.cur);
const lastOdo=id=>Math.max(0,...S.records.filter(r=>r.vid===id&&r.type!=="reminder"&&r.odo!==""&&r.odo!=null).map(r=>+r.odo||0));
let RC={};
const REP=[[0,"Doesn't repeat"],[6,"Every 6 months"],[12,"Every year"],[24,"Every 2 years"],[36,"Every 3 years"]];
const vrep=n=>REP.filter(x=>x[0]).map(([m,l])=>`<option value="${m}" ${m===+n?"selected":""}>${l}</option>`).join("");
const repTxt=n=>n%12===0?(n===12?"year":n/12+" years"):n+" months";
const nextDate=(d,n)=>{let x=addM(d||today(),n),i=0;while(x<=today()&&i++<60)x=addM(x,n);return x};
const vDates=v=>[v.kind==="offroad"&&v.ohv&&{k:"ohv",l:"OHV sticker expires",date:v.ohv,rep:v.ohvRep??24},v.kind!=="mower"&&v.reg&&{k:"reg",l:"Registration expires",date:v.reg,rep:v.regRep??24}].filter(Boolean);
const pseudo=v=>vDates(v).map(x=>({desc:x.l,date:x.date,odo:"",vid:v.id,pk:x.k,rep:x.rep}));
const partsOf=r=>(r.parts?[r.parts]:[]).concat(r.pl||[]).concat((r.iu||[]).map(x=>x.n+" ×"+x.q+(x.u?" "+x.u:"")));
const rbtn=r=>r.pk?`<button style="margin-top:8px" data-renew="${r.pk}">Renew</button>`:r.id?(r.rep>0?`<button style="margin-top:8px" data-renew="${r.id}">Renew</button>`:`<button style="margin-top:8px" data-done="${r.id}">Mark done</button>`):"";
// Rough date a distance/hours reminder will come due, from how fast the readings have been climbing.
function estTxt(id,d){
  const a=S.records.filter(r=>r.vid===id&&r.type!=="reminder"&&r.date&&r.odo!==""&&r.odo!=null).map(r=>[Date.parse(r.date+"T00:00:00Z"),+r.odo]).sort((x,y)=>x[0]-y[0]);
  if(a.length<2)return"";
  const e=a[a.length-1],b0=a.filter(x=>x[0]>=e[0]-365*864e5),b=b0.length>1?b0:a,days=(e[0]-b[0][0])/864e5,du=e[1]-b[0][1];
  if(days<14||du<=0)return"";
  const t=e[0]+d/(du/days)*864e5,now=Date.parse(today()+"T00:00:00Z");
  if(t<=now+864e5)return" (est. now)";
  const o=t-now<90*864e5?{month:"short",day:"numeric"}:{month:"short",year:"numeric"};
  return" (est. "+new Date(t).toLocaleDateString(undefined,Object.assign({timeZone:"UTC"},o))+")";
}
function rinfo(r,lo){
  if(r.done)return{st:-1,txt:"Done"};let st=0,p=[];
  if(r.date){const d=Math.round((new Date(r.date)-new Date(today()))/864e5);st=d<0?2:d<=soonD(r.vid)?1:0;p.push(d<0?`${-d}d overdue`:d===0?"due today":`in ${d}d`)}
  if(r.odo!==""&&r.odo!=null){const d=r.odo-lo;st=Math.max(st,d<=0?2:d<=soonAt(r.vid)?1:0);p.push(d<=0?`${-d} ${dU(r.vid)} over`:`in ${d} ${dU(r.vid)}${estTxt(r.vid,d)}`)}
  return{st,txt:p.join(" / ")};
}
function vstat(v){
  const lo=lastOdo(v.id),a=S.records.filter(r=>r.vid===v.id&&r.type==="reminder"&&!r.done).map(r=>({r,i:rinfo(r,lo)})).concat(pseudo(v).map(r=>({r,i:rinfo(r,lo)}))).sort((x,y)=>y.i.st-x.i.st||(x.r.date||"9").localeCompare(y.r.date||"9"));
  if(!a.length)return{st:0,txt:"No reminders set"};
  return{st:a[0].i.st,txt:`${a[0].r.desc||"Reminder"} · ${a[0].i.txt}`};
}
const tag=st=>st==2?'<span class="tag bad">Overdue</span>':st==1?'<span class="tag warn">Due soon</span>':'<span class="tag ok">OK</span>';

  <label>Appearance</label><select id="th"><option value="auto">Match my device</option><option value="dark">Dark</option><option value="light">Light</option></select>
  <label>Distance units</label><select id="u"><option value="imperial" ${S.units==="imperial"?"selected":""}>Miles</option><option value="metric" ${S.units==="metric"?"selected":""}>Kilometers</option></select>
  <label>Quick-pick services</label><div class="row"><select id="qk">${KINDS.map(k=>`<option value="${k[0]}">${k[1]}</option>`).join("")}</select><button id="qke" style="flex:none">Edit list</button></div>
  <label>Reminder alerts</label><input id="al_u" type="url" inputmode="url" placeholder="https://ntfy.sh/your-topic" value="${esc(al.url||"")}">
  <div class="row" style="margin-top:6px"><select id="al_f"><option value="text" ${al.fmt!=="json"?"selected":""}>ntfy / text</option><option value="json" ${al.fmt==="json"?"selected":""}>JSON webhook</option></select><select id="al_h">${[...Array(18).keys()].map(i=>i+5).map(h=>`<option value="${h}" ${(+al.hour||8)===h?"selected":""}>${h%12||12}:00 ${h<12?"AM":"PM"}</option>`).join("")}</select></div>
  <div class="row" style="margin-top:6px"><button id="al_t" style="flex:1">Send test message</button></div>
  <div class="m" id="al_m" style="margin-top:6px">The server sends a message when something becomes due soon or overdue, then weekly while it stays overdue. Use "JSON webhook" for Home Assistant or Gotify. Leave the address empty to turn alerts off.</div>
  <div class="m" style="margin-top:12px">Server sync: <span id="ss">${syncMsg}</span></div>
  <label>Backup</label><div class="row"><button id="dlb" style="flex:1">Download backup</button><button id="rfb" style="flex:1">Restore from file</button></div><input type="file" id="rf" accept=".json,application/json" hidden><div class="row" style="margin-top:8px"><button id="csvb" style="flex:1">Export all records (CSV)</button></div>
  <details style="margin-top:12px"><summary class="m">Copy or paste backup text (no photos)</summary><textarea id="bk" rows="5" style="margin-top:8px">${esc(JSON.stringify(S))}</textarea><button id="imp" style="margin-top:8px;width:100%">Restore from text</button></details>
  <div class="row" style="margin-top:14px"><button class="p" id="ok" style="flex:1">Done</button></div>`);
  $("th").value=theme();$("th").onchange=()=>setTheme($("th").value);
  $("u").onchange=()=>{S.units=$("u").value;save();render()};
  $("qke").onclick=()=>presetForm($("qk").value);
  const sa=()=>{const u=$("al_u").value.trim();if(u)S.alert={url:u,fmt:$("al_f").value,hour:+$("al_h").value,tz:Intl.DateTimeFormat().resolvedOptions().timeZone};else delete S.alert;save()};
  ["al_u","al_f","al_h"].forEach(i=>$(i).onchange=sa);
  $("al_t").onclick=async()=>{const u=$("al_u").value.trim(),m=$("al_m");if(!/^https?:\/\//.test(u)){m.textContent="Enter the address first.";return}sa();m.textContent="Sending…";
    try{const r=await fetch("api/alert/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:u,fmt:$("al_f").value})});m.textContent=r.ok?"Sent. Check your phone.":"The server could not reach that address."}catch(e){m.textContent="Could not reach the Garage Log server."}};
  $("ok").onclick=()=>$("dlg").close();
  $("dlb").onclick=async()=>{const b=$("dlb");b.textContent="Preparing…";const c=await inlined();b.textContent="Download backup";const bl=new Blob([JSON.stringify(c)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="garage-log-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
  $("rfb").onclick=()=>$("rf").click();
  $("rf").onchange=async()=>{const f=$("rf").files[0];if(f)restore(await f.text())};
  $("imp").onclick=()=>restore($("bk").value);
  $("csvb").onclick=()=>csvExport();
}
$("hd").onclick=e=>{const i=e.target.id;if(i==="back"){view="garage";render()}else if(i==="more")dataForm();else if(i==="ev")vehForm(true)};
$("tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;if(t==="more")return moreMenu();if(view==="vehicle")tab=t;else if(view==="inventory")ic=t;else gk=t;render()};
$("bn").onclick=e=>{const v=e.target.dataset.v;if(v){view=v;render()}};
$("fab").onclick=()=>view==="vehicle"?(tab==="parts"?addPart():openForm()):view==="inventory"?invForm():vehForm(false);
$("fabE").onclick=()=>{if(tab==="parts")specForm();else{em=!em;render()}};
$("list").onclick=e=>{const d=e.target.dataset,op=e.target.closest("[data-open]");
  if(op){S.cur=op.dataset.open;view="vehicle";tab="dash";save();render()}
  else if(d.del){const r0=S.records.find(r=>r.id===d.del);if(confirm("Delete this entry?"+((r0&&(r0.iu||[]).length)?" Parts taken from inventory will be put back.":""))){if(r0)adjInv(r0.iu,[]);S.records=S.records.filter(r=>r.id!==d.del);save();render()}}
  else if(d.edit)openForm(d.edit);
  else if(d.done){const r=S.records.find(x=>x.id===d.done);r.done=true;save();render();logFrom(r)}
  else if(d.renew)renewDlg(d.renew);
  else if(d.rcok){const v=veh();v.rcOk=[...(v.rcOk||[]),d.rcok];save();render()}
  else if(d.srch)searchForm(veh());
  else if(d.qodo)openForm(null,{type:"odometer"});
  else if(d.specs)specForm();
  else if(d.go){tab=d.go;render()}
  else if(d.ph){const[id,i,g]=d.ph.split(":");show(`<img src="${S.records.find(r=>r.id===id)[g||"ph"][+i]}" style="width:100%;border-radius:8px"><div class="row" style="margin-top:10px"><button id="cancel" style="flex:1">Close</button></div>`)}
  else if(d.idel){if(confirm("Remove this item?")){S.inv=S.inv.filter(i=>i.id!==d.idel);save();render()}}
  else if(d.iedit)invForm(d.iedit);
  else if(d.q){const[id,n]=d.q.split(":"),it=S.inv.find(i=>i.id===id);it.qty=Math.max(0,+(it.qty+ +n).toFixed(2));save();render()}};
const fixV=v=>{v.specs=v.specs||{};if(!v.plist){const sp=v.specs;v.plist=SPECS.filter(([k])=>sp[k]).map(([k,l])=>({l,v:sp[k]}));if(sp.other)v.plist.push({l:"Other",v:sp.other})}if(!v.pclean){v.plist=v.plist.filter(r=>r.v||!SPECS.some(x=>x[1]===r.l));v.pclean=1}v.kind=v.kind==="atv"||v.kind==="bike"?"offroad":v.kind||"car";v.meter=v.meter||"dist"};S.vehicles.forEach(fixV);
render();
let syncMsg="not connected yet",pt=null,busy=false,again=false,base=null;
const api=()=>"api/state",AK=["vehicles","records","inv"],SK=["units","presets","alert"];
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=o=>{o.records=(o.records||[]).filter(r=>r.type!=="fuel");o.vehicles=o.vehicles||[];o.vehicles.forEach(fixV);return o};
const cmp=o=>JSON.stringify(Object.assign({},o,{cur:null,rev:0}));
const stash=()=>{try{localStorage.setItem("garagelog",JSON.stringify(S))}catch(e){}};
const setBase=o=>{base=norm(clone(o));try{localStorage.setItem("garagelog-base",JSON.stringify(base))}catch(e){}};
try{const b=localStorage.getItem("garagelog-base");if(b)base=norm(JSON.parse(b))}catch(e){}
// What changed on this device since the last sync, by item id.
function diff(a,b){
  const o={};
  for(const k of AK){
    const am=new Map((a[k]||[]).map(x=>[x.id,JSON.stringify(x)])),bm=new Map((b[k]||[]).map(x=>[x.id,x])),ups=[];
    for(const[id,x]of bm)if(am.get(id)!==JSON.stringify(x))ups.push(x);
    const del=[...am.keys()].filter(id=>!bm.has(id));
    if(ups.length||del.length)o[k]={ups,del};
  }
  for(const k of SK)if(JSON.stringify(a[k])!==JSON.stringify(b[k]))o[k]={set:b[k]};
  return o;
}
function apply(T,o){
  for(const k of AK)if(o[k]){const m=new Map((T[k]||[]).map(x=>[x.id,x]));o[k].del.forEach(id=>m.delete(id));o[k].ups.forEach(x=>m.set(x.id,x));T[k]=[...m.values()]}
  for(const k of SK)if(o[k]){if(o[k].set===undefined)delete T[k];else T[k]=o[k].set}
  return T;
}
const adopt=d=>{const cur=S.cur;S=Object.assign({inv:[],units:"imperial"},d,{cur});norm(S);stash()};
// Put this device's unsynced edits on top of the server's latest state.
const mergeIn=T=>{const o=base?diff(base,S):{},cur=S.cur;S=apply(norm(clone(T)),o);S.cur=cur;stash();setBase(T)};
const redraw=()=>{if(view==="vehicle"&&!veh())view="garage";if(!$("dlg").open)render()};
const push=()=>{clearTimeout(pt);pt=setTimeout(()=>{pt=null;send()},400)};
async function send(){
  if(busy){again=true;return}
  busy=true;let more=false,merged=false;
  try{
    for(let n=0;n<4;n++){
      const sent=JSON.stringify(S),r=await fetch(api(),{method:"PUT",headers:{"Content-Type":"application/json"},body:sent});
      if(r.status===409){
        const T=await r.json();
        if(base){mergeIn(T);merged=true;redraw();continue}
        adopt(T);setBase(T);syncMsg="loaded changes from another device";redraw();break;
      }
      if(!r.ok)throw 0;
      const j=await r.json();S.rev=j.rev;const b=JSON.parse(sent);b.rev=j.rev;setBase(b);stash();
      syncMsg=merged?"saved to server (merged with changes from another device)":"saved to server";if(sent.includes('"data:image'))more=true;break;
    }
  }catch(e){syncMsg="offline (saved on this device only)"}
  busy=false;
  if(again){again=false;send()}else if(more)pull(true);
}
const pull=f=>{
  if(!f&&(pt||busy||$("dlg").open))return Promise.resolve();
  return fetch(api(),{cache:"no-store"}).then(r=>r.json()).then(d=>{
    syncMsg="saved to server";
    if(d&&Array.isArray(d.vehicles)&&(d.vehicles.length||(d.records||[]).length||(d.inv||[]).length)){
      const o=base?diff(base,S):null;
      if(o&&Object.keys(o).length){mergeIn(d);redraw();push()}
      else{if(cmp(norm(clone(d)))===cmp(S)){if(d.rev!==undefined)S.rev=d.rev}else{adopt(d);redraw()}setBase(d)}
    }else if(S.vehicles.length)push();
  }).catch(()=>{syncMsg="offline (saved on this device only)"});
};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
pull();loadRc();
try{if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script>
